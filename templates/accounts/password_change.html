{% extends "base.html" %}
{% load static %}

{% block title %}Зміна пароля{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="">
  </div>
  <div class="auth-form-container">
    <div class="auth-container auth-container--forgot-password">
      <div class="Legend">
        <h1 class="auth-title">Зміна пароля</h1>
      </div>

      <form class="auth-form" method="post" action="{% url 'accounts:password_change' %}">
        {% csrf_token %}
        {% include "partials/form_errors.html" with form=form %}
        <div class="InputField">
          <label for="old_password">Поточний пароль</label>
          <input type="password" id="old_password" name="old_password" class="Input" autocomplete="current-password" required>
        </div>
        <div class="InputField">
          <label for="new_password1">Новий пароль</label>
          <input type="password" id="new_password1" name="new_password1" class="Input" autocomplete="new-password" required>
        </div>
        <div class="InputField">
          <label for="new_password2">Повторіть новий пароль</label>
          <input type="password" id="new_password2" name="new_password2" class="Input" autocomplete="new-password" required>
        </div>

        <div class="ButtonGroup ButtonGroup--center">
          <button type="submit" class="button button--primary">Змінити пароль</button>
        </div>

        <div class="TextLink">
          <a href="{% url 'accounts:profile' %}#account-info">Назад до кабінету</a>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
